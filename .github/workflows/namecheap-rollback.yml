# Manual Namecheap rollback only.
# Automatic Namecheap deploys are DISABLED so they cannot race the OVH VPS workflow.
# Public DNS still points at Namecheap until an explicit cutover.
name: Namecheap rollback (manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type ROLLBACK-NAMECHEAP to confirm'
        required: true
        type: string

concurrency:
  group: namecheap-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm == 'ROLLBACK-NAMECHEAP' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Sync Clover menu and build
        run: npm run build
        env:
          CLOVER_MERCHANT_ID: ${{ secrets.CLOVER_MERCHANT_ID }}
          CLOVER_API_TOKEN: ${{ secrets.CLOVER_API_TOKEN }}
          CLOVER_API_BASE: https://api.clover.com
          VITE_CLOVER_ORDERING_URL: ${{ secrets.VITE_CLOVER_ORDERING_URL }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$NAMECHEAP_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$NAMECHEAP_SSH_PORT" "$NAMECHEAP_SSH_HOST" >> ~/.ssh/known_hosts
        env:
          NAMECHEAP_SSH_PRIVATE_KEY: ${{ secrets.NAMECHEAP_SSH_PRIVATE_KEY }}
          NAMECHEAP_SSH_HOST: ${{ secrets.NAMECHEAP_SSH_HOST }}
          NAMECHEAP_SSH_PORT: ${{ secrets.NAMECHEAP_SSH_PORT }}

      - name: Deploy to Namecheap (rollback target)
        run: |
          rsync -avz --delete \
            -e "ssh -p $NAMECHEAP_SSH_PORT -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes" \
            dist/ \
            "$NAMECHEAP_SSH_USER@$NAMECHEAP_SSH_HOST:~/allstareateries.com/"
        env:
          NAMECHEAP_SSH_HOST: ${{ secrets.NAMECHEAP_SSH_HOST }}
          NAMECHEAP_SSH_PORT: ${{ secrets.NAMECHEAP_SSH_PORT }}
          NAMECHEAP_SSH_USER: ${{ secrets.NAMECHEAP_SSH_USER }}
