<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Print Menu | All Star Eateries</title>
    <meta
      name="description"
      content="Printable letter menu for All Star Eateries — synced from Clover POS."
    />
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Great+Vibes&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/print-menu.css" />
  </head>
  <body>
    <div class="print-toolbar">
      <p class="print-toolbar__hint">
        Letter · Background graphics ON · Margins: None · Synced from Clover
      </p>
      <div class="print-toolbar__actions">
        <a class="btn btn--ghost" href="/menu.html">Back to menu</a>
        <button class="btn" type="button" id="print-btn">Print / Save PDF</button>
      </div>
    </div>

    <p class="print-status" id="print-menu-status">Loading menu from Clover…</p>
    <main class="sheet" id="print-menu-root" aria-live="polite"></main>

    <script type="module" src="/src/print-menu.js"></script>
  </body>
</html>
