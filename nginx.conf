server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Deny hidden / private files
    location ~ /\. {
        deny all;
        return 404;
    }

    location = /menu-data.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location /images/ {
        expires 1d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
